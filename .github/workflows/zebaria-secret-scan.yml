name: Zebaria - Secret Scan

# Runs gitleaks on every push and PR. Fails the workflow if any
# credential pattern is detected in the diff or repo. Combined with
# branch protection on `preview` and `main`, this prevents merging
# code that contains secrets.
#
# Patterns include AWS keys, Slack tokens/webhooks, GitHub PATs,
# private keys, generic high-entropy strings, etc. — gitleaks ships
# a default ruleset that we extend in .gitleaks.toml.

on:
  push:
    branches: [preview, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs full history to scan the diff range on PRs
          # and the full repo on push.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No license needed for OSS public repos.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true
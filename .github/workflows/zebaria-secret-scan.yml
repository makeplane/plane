name: Zebaria - Secret Scan

# Runs gitleaks on every push and PR. Fails the workflow if any
# credential pattern is detected in the diff or repo. Combined with
# branch protection on `preview` and `main`, this prevents merging
# code that contains secrets.
#
# Patterns include AWS keys, Slack tokens/webhooks, GitHub PATs,
# private keys, generic high-entropy strings, etc. — gitleaks ships
# a default ruleset that we extend in .gitleaks.toml.
#
# Uses the gitleaks binary directly (Apache-2.0) rather than the
# gitleaks-action wrapper, because the wrapper requires a paid
# license key for use on org repos.

on:
  push:
    branches: [preview, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  gitleaks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs full history to scan the diff range on PRs
          # and the full repo on push.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan
        run: |
          set -euo pipefail
          # --baseline-path suppresses findings present at the time
          # the baseline was generated (mostly upstream-history test
          # fixtures and sample tokens). Any NEW leak fails the scan.
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --baseline-path .gitleaks-baseline.json \
            --redact \
            --verbose
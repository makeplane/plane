# Baseline Scan — runs every registered check against the full contents of its
# target files, rather than against one pull request's diff.
#
# The per-PR scan (security-scan-pr.yml) only ever sees newly changed code, so it
# will never flag a pre-existing issue in a file nobody has touched. This workflow
# is how that backlog gets surfaced. It is manual on purpose: there is no pull
# request to attach results to, and a scheduled run would spend API budget on a
# report nobody asked for.
#
# Spec: SPEC.md   Domain vocabulary ("Baseline Scan"): CONTEXT.md
# Results are written to the run's job summary.

name: Security scan (baseline)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # actions/checkout reads the repository source. No pull-requests permission is
  # needed: this workflow reports to the job summary, not to a PR comment.
  contents: read

jobs:
  baseline-scan:
    name: Scan full codebase
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6

      - name: Enable Corepack and pnpm
        run: corepack enable pnpm

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run baseline security scan
        env:
          # A human triggered this run deliberately, so unlike the PR scan a
          # missing key here is worth surfacing rather than skipping silently.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm exec tsx .github/scripts/security-scan/run.ts --mode=full

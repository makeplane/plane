name: Migration check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "preview"
      - "canary"
      - "master"
    types:
      - "opened"
      - "synchronize"
      - "reopened"
      - "ready_for_review"
    paths:
      - "apps/api/**"
      - ".github/workflows/migration-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migration-check:
    name: check + makemigrations --check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    env:
      DJANGO_SETTINGS_MODULE: plane.settings.production
      # No database or redis is contacted: `check` and `makemigrations --check`
      # read the migration graph off disk. These only need to parse.
      SECRET_KEY: ci-migration-check
      REDIS_URL: redis://127.0.0.1:6379/0
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      # On pull_request this checks out refs/pull/N/merge — the PR already
      # merged into the base branch — so the checks below run against the
      # post-merge migration graph, not the branch in isolation.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          # uv version comes from [tool.uv] required-version.
          version-file: "apps/api/pyproject.toml"
          # Same patch release as the production image (python:3.12.12-alpine);
          # uv fetches a managed build instead of the runner's older system 3.12.
          python-version: "3.12.12"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      # Same dependency set as the production image (Dockerfile.api).
      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --locked --no-default-groups --group production

      - name: Django system checks
        working-directory: apps/api
        run: uv run --no-sync python manage.py check

      # Fails on two leaf nodes in one app (the PR and the base branch both
      # numbered a migration off the same parent), on a dependency pointing at
      # a migration that does not exist, on models whose changes were never
      # written to a migration at all, and (exit 2, from the makemigrations
      # override in plane/db) on a migrations_lockfile.txt that does not match
      # the migration graph. The lockfile fails only PRs that touch migrations
      # or the lockfile; on any other PR a stale lockfile is a warning, so one
      # bad merge into the base branch does not turn every PR red.
      - name: Migration graph and model/migration drift
        working-directory: apps/api
        run: |
          if git diff --quiet HEAD^1 HEAD -- 'plane/*/migrations/*.py' migrations_lockfile.txt; then
            uv run --no-sync python manage.py makemigrations --check --dry-run --lockfile-warn-only
          else
            uv run --no-sync python manage.py makemigrations --check --dry-run
          fi

      # HEAD^1 is the base branch tip, HEAD^2 the PR head, so this is exactly
      # what the PR does to files that already exist on the base branch.
      # Renumbering or rewriting a merged migration leaves every already-migrated
      # environment with a django_migrations row that no longer resolves.
      - name: Guard already-merged migrations
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'migration-history-override')
        run: |
          TOUCHED=$(git diff --name-status --diff-filter=MDR HEAD^1 HEAD -- 'apps/api/*/migrations/*.py')
          if [ -n "$TOUCHED" ]; then
            echo "::error::This PR edits, deletes or renames migrations that are already on ${{ github.base_ref }}:"
            echo "$TOUCHED"
            echo "Add a new migration instead. If the rewrite is deliberate and no"
            echo "environment has applied the old file, label the PR 'migration-history-override'."
            exit 1
          fi

  # Adds the migrations label. Its own job so the token that can edit PRs never
  # sits next to the PR code the job above runs: this one has no checkout and
  # only reads the file list. Fork PRs get a read-only token, so they skip it.
  label:
    name: label migration PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Add the migrations label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          FILES=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          if grep -q '^apps/api/plane/[^/]*/migrations/0[^/]*\.py$' <<< "$FILES"; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "🔄migrations"
          fi

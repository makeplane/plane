name: Production release checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - preview
    paths:
      - "deployments/production/**"
      - "docker-compose.yml"
      - "docker-compose-prod.yml"
      - ".github/workflows/deploy-production.yml"
      - ".github/workflows/build-branch.yml"
      - ".github/workflows/production-release-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-helpers:
    name: Release helper tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Unit tests, compose fail-fast, workflow isolation
        run: python3 deployments/production/test_plane_release.py -v
      - name: Shell syntax
        run: |
          bash -n deployments/production/common.sh
          bash -n deployments/production/deploy.sh
          bash -n deployments/production/rollback.sh
          bash -n deployments/production/healthcheck.sh

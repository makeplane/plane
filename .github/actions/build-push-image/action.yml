name: Build and push Plane image
description: Build and push the exact Docker image reference from repository variables.

inputs:
  dockerhub-username:
    description: Docker Hub username
    required: true
  dockerhub-token:
    description: Docker Hub token
    required: true
  image:
    description: Full image reference (username/repo-name:tag-name)
    required: true
  build-context:
    description: Docker build context
    required: true
  dockerfile-path:
    description: Path to the Dockerfile
    required: true
  buildx-driver:
    description: Buildx driver
    required: true
  buildx-version:
    description: Buildx version
    required: true
  buildx-platforms:
    description: Buildx platforms
    required: true
  buildx-endpoint:
    description: Buildx endpoint (empty uses the default builder)
    required: false
    default: ""
  build-args:
    description: Docker build-args
    required: false
    default: ""
  additional-assets:
    description: Artifact name to download into the build context
    required: false
    default: ""
  additional-assets-dir:
    description: Directory to extract additional assets into
    required: false
    default: ""

outputs:
  digest:
    description: Pushed image digest
    value: ${{ steps.build.outputs.digest }}
  image:
    description: Image reference that was pushed
    value: ${{ inputs.image }}
  source-sha:
    description: Git commit SHA baked into the image
    value: ${{ github.sha }}

runs:
  using: composite
  steps:
    - name: Require image ref and Hub credentials
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DOCKERHUB_USERNAME: ${{ inputs.dockerhub-username }}
        DOCKERHUB_TOKEN: ${{ inputs.dockerhub-token }}
      run: |
        if [ -z "$IMAGE" ]; then
          echo "image input is required (username/repo-name:tag-name)" >&2
          exit 1
        fi
        if [[ "$IMAGE" != *:* ]]; then
          echo "Invalid image='$IMAGE'. Expected username/repo-name:tag-name" >&2
          exit 1
        fi
        if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
          echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are required to push" >&2
          exit 1
        fi
        tag="${IMAGE##*:}"
        without_tag="${IMAGE%:*}"
        timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "Source SHA ${{ github.sha }}" >&2
        echo "Destination image $IMAGE" >&2
        echo "CACHE_REF=${without_tag}:buildcache-${tag}" >> "$GITHUB_ENV"
        echo "PLANE_BUILD_TIMESTAMP=${timestamp}" >> "$GITHUB_ENV"

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: Set up Docker Buildx
      if: ${{ inputs.buildx-endpoint != '' }}
      uses: docker/setup-buildx-action@v3
      with:
        driver: ${{ inputs.buildx-driver }}
        version: ${{ inputs.buildx-version }}
        endpoint: ${{ inputs.buildx-endpoint }}

    - name: Set up Docker Buildx
      if: ${{ inputs.buildx-endpoint == '' }}
      uses: docker/setup-buildx-action@v3
      with:
        driver: ${{ inputs.buildx-driver }}
        version: ${{ inputs.buildx-version }}

    - name: Download additional assets
      if: ${{ inputs.additional-assets != '' && inputs.additional-assets-dir != '' }}
      uses: actions/download-artifact@v7
      with:
        name: ${{ inputs.additional-assets }}
        path: ${{ inputs.additional-assets-dir }}

    - name: Build and push
      id: build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.build-context }}
        file: ${{ inputs.dockerfile-path }}
        platforms: ${{ inputs.buildx-platforms }}
        tags: ${{ inputs.image }}
        push: true
        provenance: false
        sbom: false
        # Registry layer cache only. Application COPY layers invalidate when
        # the current checkout changes, so cache cannot substitute stale source
        # for github.sha.
        cache-from: type=registry,ref=${{ env.CACHE_REF }}
        cache-to: type=registry,ref=${{ env.CACHE_REF }},mode=max
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.created=${{ env.PLANE_BUILD_TIMESTAMP }}
        build-args: |
          PLANE_GIT_REVISION=${{ github.sha }}
          PLANE_GIT_SOURCE=https://github.com/${{ github.repository }}
          PLANE_BUILD_TIMESTAMP=${{ env.PLANE_BUILD_TIMESTAMP }}
          ${{ inputs.build-args }}
      env:
        DOCKER_BUILDKIT: 1

    - name: Report image digest
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        if [ -z "$DIGEST" ]; then
          echo "Build-push did not report a digest for $IMAGE" >&2
          exit 1
        fi
        echo "component_ref=$IMAGE"
        echo "digest=$DIGEST"
        echo "source_sha=${{ github.sha }}"
        echo "Pushed $IMAGE @ $DIGEST from ${{ github.sha }}"
        {
          echo "### Image identity"
          echo ""
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| Ref | \`$IMAGE\` |"
          echo "| Digest | \`$DIGEST\` |"
          echo "| Source SHA | \`${{ github.sha }}\` |"
        } >> "$GITHUB_STEP_SUMMARY"

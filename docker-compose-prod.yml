      SECRET_KEY: ${SECRET_KEY}
      SILO_HMAC_SECRET_KEY: ${SILO_HMAC_SECRET_KEY}
      SSL_VERIFY: ${SSL_VERIFY}
      USE_MINIO: ${USE_MINIO}
      USE_STORAGE_PROXY: ${USE_STORAGE_PROXY}

# Compatibility filename for existing VPS commands:
#   docker compose -f docker-compose-prod.yml ...
# The supported production topology is docker-compose.yml.
# Keep both files in the same directory. Do not restore the commercial
# v3.0.1 dump (makeplane/*-commercial, PI, Silo, Monitor, payment/feature-flag
# hosts). That topology is not implemented by this Community fork.

include:
  - path: docker-compose.yml

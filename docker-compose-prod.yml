name: plane
services:
  admin:
    depends_on:
      api:
        condition: service_started
        required: true
      web:
        condition: service_started
        required: true
    deploy:
      replicas: 1
    image: ${PLANE_IMAGE_ADMIN}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      default: null
    restart: unless-stopped
  api:
    command:
      - ./bin/docker-entrypoint-api-ee.sh
    depends_on:
      plane-db:
        condition: service_started
        required: true
      plane-redis:
        condition: service_started
        required: true
    deploy:
      replicas: 1
    environment:
      AES_SECRET_KEY: ${AES_SECRET_KEY}
      AMQP_URL: ${AMQP_URL}
      API_BASE_URL: ${API_BASE_URL}
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT}
      APP_DOMAIN: ${APP_DOMAIN}
      APP_VERSION: ${APP_VERSION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      BUCKET_NAME: ${BUCKET_NAME}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      DEBUG: ${DEBUG}
      DEPLOY_PLATFORM: ${DEPLOY_PLATFORM}
      ENABLE_DRF_SPECTACULAR: ${ENABLE_DRF_SPECTACULAR}
      FEATURE_FLAG_SERVER_BASE_URL: ${FEATURE_FLAG_SERVER_BASE_URL}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT}
      FOLLOWER_POSTGRES_URI: ${FOLLOWER_POSTGRES_URI}
      FRONTEND_OTEL_ENABLED: ${FRONTEND_OTEL_ENABLED}
      FRONTEND_OTLP_ENDPOINT: ${FRONTEND_OTLP_ENDPOINT:-}
      FRONTEND_OTLP_HEADERS: ${FRONTEND_OTLP_HEADERS:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS}
      INSTANCE_ID: ${INSTANCE_ID}
      INTAKE_EMAIL_DOMAIN: ${INTAKE_EMAIL_DOMAIN}
      IS_AIRGAPPED: ${IS_AIRGAPPED}
      IS_SELF_MANAGED: ${IS_SELF_MANAGED}
      LIVE_BASE_PATH: ${LIVE_BASE_PATH}
      LIVE_BASE_URL: ${LIVE_BASE_URL}
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
      MACHINE_SIGNATURE: ${MACHINE_SIGNATURE}
      MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      OPENSEARCH_ENABLED: ${OPENSEARCH_ENABLED}
      OPENSEARCH_INDEX_PREFIX: ${OPENSEARCH_INDEX_PREFIX:-}
      OPENSEARCH_ML_MODEL_ID: ${OPENSEARCH_ML_MODEL_ID:-}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-}
      PAYMENT_SERVER_BASE_URL: ${PAYMENT_SERVER_BASE_URL}
      PGDATA: ${PGDATA}
      PI_BASE_PATH: ${PI_BASE_PATH}
      PI_BASE_URL: ${PI_BASE_URL}
      PI_INTERNAL_SECRET: ${PI_INTERNAL_SECRET}
      PLANE_PI_DATABASE_URL: ${PLANE_PI_DATABASE_URL}

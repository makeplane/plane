      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready/', timeout=5)
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 1m0s
    image: ${PLANE_IMAGE_BACKEND}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${PLANE_DATA_DIR:-/opt/plane}/logs/api
        target: /code/plane/logs
        bind:
          create_host_path: true

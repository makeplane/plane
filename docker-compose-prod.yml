name: plane
services:
  admin:
    depends_on:
      api:
        condition: service_started
        required: true
      web:
        condition: service_started
        required: true
    deploy:
      replicas: 1
    image: "${PLANE_IMAGE_ADMIN:-makeplane/admin-commercial:v3.0.1}"
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      default: null
    restart: unless-stopped
  api:
    command:
      - ./bin/docker-entrypoint-api-ee.sh
    depends_on:
      plane-db:
        condition: service_started
        required: true
      plane-redis:
        condition: service_started
        required: true
    deploy:
      replicas: 1
    environment:
      AES_SECRET_KEY: ${AES_SECRET_KEY:-wvRonyo2xksk00E2h0hAbR5pFETQwbBK}
      AMQP_URL: "${AMQP_URL:-amqp://plane:plane@plane-mq:5672/plane}"
      API_BASE_URL: "${API_BASE_URL:-http://api:8000}"
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
      APP_DOMAIN: ${APP_DOMAIN:-plane.aitech.net.au}
      APP_VERSION: ${APP_VERSION:-v3.0.1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-access-key}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      AWS_S3_ENDPOINT_URL: "${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}"
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-secret-key}
      BUCKET_NAME: ${BUCKET_NAME:-uploads}
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://plane.aitech.net.au,https://plane.aitech.net.au}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://plane:plane@plane-db/plane}"
      DEBUG: ${DEBUG:-0}
      DEPLOY_PLATFORM: ${DEPLOY_PLATFORM:-DOCKER_COMPOSE}
      ENABLE_DRF_SPECTACULAR: ${ENABLE_DRF_SPECTACULAR:-0}
      FEATURE_FLAG_SERVER_BASE_URL: "${FEATURE_FLAG_SERVER_BASE_URL:-http://monitor:8080}"
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      FOLLOWER_POSTGRES_URI: "${FOLLOWER_POSTGRES_URI:-postgresql://plane:plane@plane-db/plane}"
      FRONTEND_OTEL_ENABLED: ${FRONTEND_OTEL_ENABLED:-0}
      FRONTEND_OTLP_ENDPOINT: ${FRONTEND_OTLP_ENDPOINT:-}
      FRONTEND_OTLP_HEADERS: ${FRONTEND_OTLP_HEADERS:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      INSTANCE_ID: ${INSTANCE_ID:-96bee07c-16c3-402f-9da2-df4b6007637b}
      INTAKE_EMAIL_DOMAIN: ${INTAKE_EMAIL_DOMAIN:-example.com}
      IS_AIRGAPPED: ${IS_AIRGAPPED:-0}
      IS_SELF_MANAGED: ${IS_SELF_MANAGED:-1}
      LIVE_BASE_PATH: ${LIVE_BASE_PATH:-/live}
      LIVE_BASE_URL: "${LIVE_BASE_URL:-http://live:3000}"
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:-htbqvBJAgpm9bzvf3r4urJer0ENReatceh}
      MACHINE_SIGNATURE: ${MACHINE_SIGNATURE:-2b69371e7e56482e975f0e72ab3436a4}
      MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-secret-key}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-access-key}
      OPENSEARCH_ENABLED: ${OPENSEARCH_ENABLED:-0}
      OPENSEARCH_INDEX_PREFIX: ${OPENSEARCH_INDEX_PREFIX:-}
      OPENSEARCH_ML_MODEL_ID: ${OPENSEARCH_ML_MODEL_ID:-}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-}
      PAYMENT_SERVER_BASE_URL: "${PAYMENT_SERVER_BASE_URL:-http://monitor:8080}"
      PGDATA: ${PGDATA:-/var/lib/postgresql/data}
      PI_BASE_PATH: ${PI_BASE_PATH:-/pi}
      PI_BASE_URL: "${PI_BASE_URL:-http://plane.aitech.net.au/pi}"
      PI_INTERNAL_SECRET: ${PI_INTERNAL_SECRET:-tyfvfqvBJAgpm9bzvf3r4urJer0Ehfdubk}
      PLANE_PI_DATABASE_URL: "${PLANE_PI_DATABASE_URL:-postgresql://plane:plane@plane-db/plane_pi}"
      POSTGRES_DB: ${POSTGRES_DB:-plane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane}
      POSTGRES_USER: ${POSTGRES_USER:-plane}
      PRIME_HOST: "${PRIME_HOST:-https://prime.plane.so}"
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-plane}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-plane}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-plane}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-plane-mq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}
      REDIS_HOST: ${REDIS_HOST:-plane-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: "${REDIS_URL:-redis://plane-redis:6379/}"
      SECRET_KEY: ${SECRET_KEY:-60gp0byfz2dvffa45cxl20p1scy9xbpf6d8c5y0geejgkyp1b5}
      SILO_HMAC_SECRET_KEY: ${SILO_HMAC_SECRET_KEY:-tnbbvj6ATPvze4zaygdujxg4dpk4hqx0WDW}
      SSL_VERIFY: ${SSL_VERIFY:-1}
      USE_MINIO: ${USE_MINIO:-1}
      USE_STORAGE_PROXY: ${USE_STORAGE_PROXY:-0}
      WEB_URL: "${WEB_URL:-http://plane.aitech.net.au}"
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready/', timeout=5)
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 1m0s
    image: "${PLANE_IMAGE_BACKEND:-makeplane/backend-commercial:v3.0.1}"
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${PLANE_DATA_DIR:-/opt/plane}/logs/api
        target: /code/plane/logs
        bind:
          create_host_path: true
  automation-consumer:

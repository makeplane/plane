services:
  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}

  plane-minio:
    image: minio/minio
    restart: unless-stopped
    networks:
      - dev_env
    entrypoint: >
      /bin/sh -c "
      mkdir -p /export/${AWS_S3_BUCKET_NAME} &&
      minio server /export --console-address ':9090' &
      sleep 5 &&
      mc alias set myminio http://localhost:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY} &&
      mc mb myminio/${AWS_S3_BUCKET_NAME} -p || true
      && tail -f /dev/null
      "
    volumes:
      - uploads:/export
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "9000:9000"
      - "9090:9090"

  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    networks:
      - dev_env
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
      - ${TESTHUB_HOST_REPO:-C:/dev/repo/innovamed-test-template}:/opt/testhub/workdir:ro
      - gitsync-clones:/opt/gitsync/clones:ro
    command: ./bin/docker-entrypoint-api-local.sh
    env_file:
      - ./apps/api/.env
    environment:
      TESTHUB_RUNNER_URL: http://testhub-runner:8090
      TESTHUB_WORKDIR: /opt/testhub/workdir
      GITSYNC_CLONE_ROOT: /opt/gitsync/clones
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
      - testhub-runner
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
      - ${TESTHUB_HOST_REPO:-C:/dev/repo/innovamed-test-template}:/opt/testhub/workdir:ro
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./apps/api/.env
    environment:
      TESTHUB_RUNNER_URL: http://testhub-runner:8090
      TESTHUB_WORKDIR: /opt/testhub/workdir
      GITSYNC_CLONE_ROOT: /opt/gitsync/clones
    depends_on:
      - api
      - plane-db
      - plane-redis
      - testhub-runner

  beat-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-db
      - plane-redis

  migrator:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: "no"
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-migrator.sh --settings=plane.settings.local
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis

  testhub-runner:
    build:
      context: ./apps/testhub-runner
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - dev_env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${TESTHUB_HOST_REPO:-C:/dev/repo/innovamed-test-template}:/opt/testhub/workdir
      - gitsync-clones:/opt/gitsync/clones
    environment:
      TESTHUB_WORKDIR: /opt/testhub/workdir
      GITSYNC_CLONE_ROOT: /opt/gitsync/clones
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  redisdata:
  uploads:
  pgdata:
  rabbitmq_data:
  gitsync-clones:

networks:
  dev_env:
    driver: bridge

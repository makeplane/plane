services:
  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}

  plane-minio:
    image: minio/minio
    restart: unless-stopped
    networks:
      - dev_env
    entrypoint: >
      /bin/sh -c "
      mkdir -p /export/${AWS_S3_BUCKET_NAME} &&
      minio server /export --console-address ':9090' &
      sleep 5 &&
      mc alias set myminio http://localhost:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY} &&
      mc mb myminio/${AWS_S3_BUCKET_NAME} -p || true
      && tail -f /dev/null
      "
    volumes:
      - uploads:/export
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "9005:9000"
      - "9090:9090"

  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    networks:
      - dev_env
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-api-local.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-db
      - plane-redis

  beat-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-db
      - plane-redis

  migrator:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: "no"
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-migrator.sh --settings=plane.settings.local
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend-dev
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - APP_FILTER=web
    env_file:
      - ./apps/web/.env
    depends_on:
      - api
    ports:
      - "3000:3000"

  admin:
    build:
      context: .
      dockerfile: Dockerfile.frontend-dev
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - APP_FILTER=admin
    env_file:
      - ./apps/admin/.env
    depends_on:
      - api
    ports:
      - "3001:3001"

  space:
    build:
      context: .
      dockerfile: Dockerfile.frontend-dev
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - APP_FILTER=space
    env_file:
      - ./apps/space/.env
    depends_on:
      - api
    ports:
      - "3002:3002"

  live:
    build:
      context: .
      dockerfile: Dockerfile.frontend-dev
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - APP_FILTER=live
    env_file:
      - ./apps/live/.env
    depends_on:
      - api
    ports:
      - "3100:3100"

volumes:
  redisdata:
  uploads:
  pgdata:
  rabbitmq_data:
  frontend_node_modules:

networks:
  dev_env:
    driver: bridge

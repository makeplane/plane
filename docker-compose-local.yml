  #   restart: unless-stopped
  #   networks:
  #     - dev_env
  #   volumes:
  #     - ./admin:/app/admin
  #   depends_on:
  #     - api
  #     - worker
  #     - web

  # live:
  #   build:
  #     context: .
  #     dockerfile: ./live/Dockerfile.dev
  #   restart: unless-stopped
  #   networks:
  #     - dev_env
  #   volumes:
  #     - ./live:/app/live
  #   depends_on:
  #     - api
  #     - worker
  #     - web

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-api-local.sh
    env_file:
      - ./apps/api/.env
    environment:
      <<: *backend-env
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./apps/api/.env
    environment:
      <<: *backend-env
    depends_on:
      - api
      - plane-db
      - plane-redis

  beat-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ./apps/api/.env
    environment:
      <<: *backend-env
    depends_on:
      - api
      - plane-db
      - plane-redis

  migrator:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: "no"
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-migrator.sh --settings=plane.settings.local
    env_file:
      - ./apps/api/.env
    environment:
      <<: *backend-env
    depends_on:
      - plane-db
      - plane-redis

  # Single-origin reverse proxy for local dev: serves the whole app on one
  # http://localhost (port 80) and routes /god-mode, /spaces, /live, /api to
  # the right place. Uses the prebuilt caddy image + Caddyfile.dev (NOT
  # Dockerfile.ce/Caddyfile.ce — those route to docker service names like
  # web:3000/admin:3000 that don't exist here, since the frontends run on the
  # HOST via `pnpm dev`). Caddyfile.dev routes /* and /god-mode/* to
  # host.docker.internal:3000/3001, preserving vite HMR (hot reload intact).
  proxy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    networks:
      - dev_env
    ports:
      - ${LISTEN_HTTP_PORT:-80}:80
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
    volumes:
      - ./apps/proxy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    # Only the backend runs in docker; web/admin/space/live are on the host.
    depends_on:
      - api

volumes:
  redisdata:
  uploads:
  pgdata:
  rabbitmq_data:

networks:
  dev_env:
    driver: bridge

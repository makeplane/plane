# Backend and data stack for the hybrid deployment. The web frontend runs on
# Railway, so there is no `web` service here. The only published port is the
# gateway's, on loopback: `tailscale serve` exposes it to the tailnet, and nothing
# is reachable from the public internet.
#
#   app     gateway <-> application services (has outbound internet for email, webhooks, OAuth)
#   data    application services <-> datastores (no outbound internet)
#   agents  agent-runner <-> agent-bridge and mcp, plus outbound internet. Agents run shell
#           commands, so the runner is on this network only: it has no route to api,
#           Postgres, Valkey, RabbitMQ or MinIO. bootstrap.sh also firewalls it off the
#           tailnet and private address ranges (see agents-firewall.sh).

name: nexus-ops

x-db-env: &db-env
  PGHOST: plane-db
  PGDATABASE: ${POSTGRES_DB:-plane}
  POSTGRES_USER: ${POSTGRES_USER:-plane}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run generate-env.sh}
  POSTGRES_DB: ${POSTGRES_DB:-plane}
  POSTGRES_PORT: 5432

x-redis-env: &redis-env
  REDIS_HOST: plane-redis
  REDIS_PORT: 6379
  REDIS_URL: redis://plane-redis:6379/

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?run generate-env.sh}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?run generate-env.sh}
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  USE_MINIO: 1
  # TLS ends at Railway, but browsers fetch signed URLs over https.
  MINIO_ENDPOINT_SSL: 1

x-app-env: &app-env
  <<: [*db-env, *redis-env, *aws-s3-env]
  WEB_URL: https://${APP_DOMAIN:?set APP_DOMAIN}
  CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN:?set APP_DOMAIN}
  DEBUG: 0
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:?run generate-env.sh}@plane-db/${POSTGRES_DB:-plane}
  AMQP_URL: amqp://${RABBITMQ_USER:-plane}:${RABBITMQ_PASSWORD:?run generate-env.sh}@plane-mq:5672/${RABBITMQ_VHOST:-plane}
  SECRET_KEY: ${SECRET_KEY:?run generate-env.sh}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?run generate-env.sh}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  # The gateway reduces X-Forwarded-For to the one verified client address.
  NUM_PROXIES: 1
  WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
  # In-app agent chat. The bridge calls the API's internal agent-session endpoint with
  # this secret, and the API hands agents this MCP address, which the runner can reach.
  AGENT_BRIDGE_SECRET: ${AGENT_BRIDGE_SECRET:?run generate-env.sh}
  PLANE_MCP_URL: http://mcp:8211/mcp
  AGENT_SESSION_TOKEN_TTL_MINUTES: ${AGENT_SESSION_TOKEN_TTL_MINUTES:-120}

services:
  gateway:
    image: caddy:2.11.8-alpine
    restart: always
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
    ports:
      - 127.0.0.1:${GATEWAY_PORT:-8080}:80
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [app, data]
    depends_on:
      - api
      - live
      - space
      - admin
      - plane-minio
      - mcp
      - agent-bridge

  api:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/plane-backend:${APP_RELEASE:?set APP_RELEASE}
    command: ./bin/docker-entrypoint-api.sh
    restart: always
    environment:
      <<: *app-env
    volumes:
      - logs_api:/code/plane/logs
    networks: [app, data]
    depends_on:
      plane-db: { condition: service_healthy }
      plane-redis: { condition: service_healthy }
      plane-mq: { condition: service_healthy }

  worker:
    image: ${IMAGE_REGISTRY}/plane-backend:${APP_RELEASE}
    command: ./bin/docker-entrypoint-worker.sh
    restart: always
    environment:
      <<: *app-env
    volumes:
      - logs_worker:/code/plane/logs
    networks: [app, data]
    depends_on:
      - api

  beat-worker:
    image: ${IMAGE_REGISTRY}/plane-backend:${APP_RELEASE}
    command: ./bin/docker-entrypoint-beat.sh
    restart: always
    environment:
      <<: *app-env
    volumes:
      - logs_beat-worker:/code/plane/logs
    networks: [app, data]
    depends_on:
      - api

  migrator:
    image: ${IMAGE_REGISTRY}/plane-backend:${APP_RELEASE}
    command: ./bin/docker-entrypoint-migrator.sh
    restart: on-failure
    environment:
      <<: *app-env
    volumes:
      - logs_migrator:/code/plane/logs
    networks: [app, data]
    depends_on:
      plane-db: { condition: service_healthy }
      plane-redis: { condition: service_healthy }

  live:
    image: ${IMAGE_REGISTRY}/plane-live:${APP_RELEASE}
    restart: always
    stop_grace_period: 30s
    environment:
      <<: *redis-env
      API_BASE_URL: http://api:8000
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?run generate-env.sh}
    networks: [app, data]
    depends_on:
      - api

  space:
    image: ${IMAGE_REGISTRY}/plane-space:${APP_RELEASE}
    restart: always
    networks: [app]
    depends_on:
      - api

  admin:
    image: ${IMAGE_REGISTRY}/plane-admin:${APP_RELEASE}
    restart: always
    networks: [app]
    depends_on:
      - api

  # Plane MCP server, built from apps/mcp under the same tag as the other images.
  # Its entrypoint (apps/mcp/nexus_serve.py) serves only the header-auth endpoint
  # at /mcp, as nobody. It calls Plane through the gateway, not api:8000, because
  # Plane builds attachment upload URLs from the request's host and only the
  # gateway sends the public one.
  mcp:
    image: ${IMAGE_REGISTRY}/plane-mcp:${APP_RELEASE}
    restart: always
    environment:
      PLANE_BASE_URL: https://${APP_DOMAIN:?set APP_DOMAIN}
      PLANE_INTERNAL_BASE_URL: http://gateway
      LOG_PAYLOADS: "false"
    # agents: the agent runner reaches it as http://mcp:8211/mcp.
    networks: [app, agents]
    depends_on:
      - api

  # ACP policy proxy for the in-app agent chat (apps/agent-bridge). The browser opens
  # wss://$APP_DOMAIN/agents/acp with its session cookie; the bridge checks the cookie
  # with the API, mints a short-lived workspace-scoped token, and relays to the runner.
  # It runs no agents itself.
  agent-bridge:
    image: ${IMAGE_REGISTRY}/plane-agent-bridge:${APP_RELEASE}
    restart: always
    stop_grace_period: 30s
    environment:
      APP_VERSION: ${APP_RELEASE}
      API_BASE_URL: http://api:8000
      AGENT_BRIDGE_SECRET: ${AGENT_BRIDGE_SECRET:?run generate-env.sh}
      AGENT_RUNNER_URL: ws://agent-runner:3410/acp
      AGENT_RUNNER_SECRET: ${AGENT_RUNNER_SECRET:?run generate-env.sh}
      # Must equal the runner's: both compute the per-user cwd from it.
      AGENT_WORKSPACES_ROOT: /workspaces
      PLANE_MCP_URL: http://mcp:8211/mcp
      # The socket is authenticated by cookie, so only the app's own origin may open it.
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN:?set APP_DOMAIN}
    networks: [app, agents]
    depends_on:
      - api
      - agent-runner

  # Runs the agents (apps/agent-runner): plane-acp-claude, -codex and -deepseek, each as
  # its workspace dir's own unprivileged uid, so this container is the sandbox. It needs
  # root to switch uids; it gets only the capabilities that takes, and agents get none.
  agent-runner:
    image: ${IMAGE_REGISTRY}/plane-agent-runner:${APP_RELEASE}
    restart: always
    stop_grace_period: 30s
    environment:
      APP_VERSION: ${APP_RELEASE}
      AGENT_RUNNER_SECRET: ${AGENT_RUNNER_SECRET:?run generate-env.sh}
      AGENT_WORKSPACES_ROOT: /workspaces
      AGENT_RUNNER_ISOLATION: uid
      AGENT_RUNNER_ENABLE_ECHO: "false"
    volumes:
      - agent_workspaces:/workspaces
    user: "0:0"
    cap_drop: [ALL]
    # CHOWN/FOWNER/DAC_OVERRIDE: create and hand over per-user dirs; SETUID/SETGID:
    # start agents as those uids; KILL: stop them.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    cpus: ${AGENT_RUNNER_CPUS:-2}
    mem_limit: ${AGENT_RUNNER_MEMORY:-3g}
    memswap_limit: ${AGENT_RUNNER_MEMORY:-3g}
    pids_limit: ${AGENT_RUNNER_PIDS:-1024}
    networks: [agents]

  plane-db:
    # The datastore and gateway images match the production VPS; change them there
    # and here together. Valkey and RabbitMQ cannot be downgraded over existing data,
    # and pg_restore cannot read a dump made by a newer Postgres major version.
    # restore.sh verify reads this image from here.
    image: postgres:18.6-alpine
    command: postgres -c 'max_connections=1000'
    restart: always
    environment:
      # Not *db-env: its PGHOST would send backup.sh's pg_dump over TCP, which needs
      # a password, instead of the trusted local socket.
      POSTGRES_USER: ${POSTGRES_USER:-plane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run generate-env.sh}
      POSTGRES_DB: ${POSTGRES_DB:-plane}
      PGDATA: /var/lib/postgresql/data
    healthcheck:
      # Over TCP: on first start the image runs a temporary socket-only server to
      # initialise the database, and a socket check would pass against that.
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]

  plane-redis:
    image: valkey/valkey:9.1.3-alpine
    restart: always
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redisdata:/data
    networks: [data]

  plane-mq:
    image: rabbitmq:4.4.0-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?run generate-env.sh}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 15s
      timeout: 10s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq-nexus.conf:/etc/rabbitmq/conf.d/90-nexus.conf:ro
    networks: [data]

  plane-minio:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: server /export --console-address ":9090"
    restart: always
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?run generate-env.sh}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?run generate-env.sh}
    volumes:
      - uploads:/export
    networks: [data]

networks:
  app:
  data:
    internal: true
  agents:
    # A fixed interface name, so agents-firewall.sh can match this network's traffic.
    driver_opts:
      com.docker.network.bridge.name: ${AGENTS_BRIDGE_NAME:-br-nexus-agents}

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:
  logs_api:
  logs_worker:
  logs_beat-worker:
  logs_migrator:
  # Agents' persistent working dirs, HOMEs and uid map (/workspaces in agent-runner).
  # backup.sh includes it.
  agent_workspaces:

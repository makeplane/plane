# Workspaces -- host nginx vhost.
#
# nginx terminates TLS and hands every request to the stack's Caddy on
# loopback; Caddy does the path routing, so there is exactly one location.
#
#   install   sudo cp deployments/workspaces/nginx.conf /etc/nginx/sites-available/workspaces.conf
#             sudo ln -s /etc/nginx/sites-available/workspaces.conf /etc/nginx/sites-enabled/
#   certs     sudo certbot --nginx -d workspaces.hgsoftware.com.np
#
# The domain is already this project's. Change it, and 8080, only if you are
# deploying elsewhere or LISTEN_HTTP_PORT in .env differs.
#
# Chicken and egg on the first install: the 443 block below names certificate
# files certbot has not created yet, so nginx will not load this file until it
# has. Install a bare port-80 vhost first, run certbot, then copy this one in.
# DEPLOYMENT.md section 4 spells that out.

# WebSocket upgrade for /live (collaborative editing). A map must live at
# http{} level; files under sites-enabled are included there, so it can stay
# in this file. The variable name is unique to this vhost so it cannot collide
# with another site's map.
map $http_upgrade $workspaces_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name workspaces.hgsoftware.com.np;

    # Left for webroot-style renewals; certbot --nginx does not need it.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` is the form every Ubuntu LTS nginx accepts (1.18 and
    # 1.24 have no `http2 on;`); nginx 1.25.1+ only warns that it is deprecated.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name workspaces.hgsoftware.com.np;

    ssl_certificate     /etc/letsencrypt/live/workspaces.hgsoftware.com.np/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workspaces.hgsoftware.com.np/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The apps set the other security headers themselves; HSTS belongs to the
    # TLS terminator.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Nothing behind nginx compresses (neither the stack's Caddy nor the
    # web/admin images have an encode directive), so do it here.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Must be at least FILE_SIZE_LIMIT from .env (default 5 MB). nginx would
    # otherwise reject a large upload before Caddy or Django see it, and the
    # browser only reports a generic failure.
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Django reads this for request.is_secure(). Without it every session
        # and CSRF cookie is issued as though the site were plain HTTP, and
        # sign-in silently never completes.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $workspaces_connection_upgrade;

        # Long-lived websocket sessions and slow uploads.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

services:
  web:
    image: ${PLANE_IMAGE_FRONTEND}
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile.web

  space:
    image: ${PLANE_IMAGE_SPACE}
    build:
      context: ../../
      dockerfile: apps/space/Dockerfile.space

  admin:
    image: ${PLANE_IMAGE_ADMIN}
    build:
      context: ../../
      dockerfile: apps/admin/Dockerfile.admin

  live:
    image: ${PLANE_IMAGE_LIVE}
    build:
      context: ../../
      dockerfile: apps/live/Dockerfile.live

  api:
    image: ${PLANE_IMAGE_BACKEND}
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.api

  proxy:
    image: ${PLANE_IMAGE_PROXY}
    build:
      context: ../../apps/proxy
      dockerfile: Dockerfile.ce

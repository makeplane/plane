# =============================================================================
# CI/CD Pipeline — Plane SHB
#
# Supports two environments via IS_AIRGAPPED variable:
#   IS_AIRGAPPED=false (default): gitlab.com + self-hosted runner (Docker Executor, internet)
#   IS_AIRGAPPED=true           : internal GitLab + Shell Executor (air-gapped, no internet)
#
# Stages: lint → test → build → deploy → release
# CI/CD targets only 3 dynamic services: web, admin, api
# (space, live, proxy deployed once manually via build-shb-images.sh + deploy-shb.sh)
# =============================================================================

stages:
  - lint
  - test
  - build
  - deploy
  - release

variables:
  PNPM_STORE_PATH: .pnpm-store
  NODE_OPTIONS: "--max-old-space-size=4096"
  # Docker image tag — short commit SHA (e.g. "a1b2c3d")
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  # Deploy directory — must match on ALL servers (dev, prod, external VPS)
  PLANE_DIR: "/opt/shb-deploy/plane-app"
  # Offline dependency cache — maintained by ops team on dev server
  PLANE_CACHE_DIR: "/opt/plane-cache"
  # Toggle: "true"  = Shell Executor, local Docker daemon (air-gapped internal)
  #         "false" = Docker Executor + DinD (gitlab.com shared runners)
  # Override to "false" in GitLab Settings → CI/CD → Variables when running on gitlab.com
  IS_AIRGAPPED: "true"
  # Full git history required for turbo --affected to detect changed packages
  GIT_DEPTH: 0
  # Package registry name for release packages
  PACKAGE_NAME: "plane-shb-release"

# ─── Cache Templates ──────────────────────────────────────────────────────────

.pnpm_cache: &pnpm_cache
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store/

.pip_cache: &pip_cache
  key: pip-cache
  paths:
    - .pip-cache/

# ─── Base Templates ───────────────────────────────────────────────────────────

.frontend_base:
  image: node:22-alpine
  cache:
    <<: *pnpm_cache
  before_script:
    - command -v git || (command -v apk && apk add --no-cache git)
    - if [ "$(uname)" = "Darwin" ]; then export PATH="/opt/homebrew/bin:$PATH"; fi
    - command -v pnpm || corepack enable pnpm
    - pnpm config set store-dir $PNPM_STORE_PATH
    - pnpm install --prefer-frozen-lockfile --offline

# =============================================================================
# STAGE 1: LINT & FORMAT
# =============================================================================

# Prettier format check — independent, no build needed
frontend:format:
  extends: .frontend_base
  stage: lint
  tags:
    - shared
  interruptible: true
  script:
    - pnpm turbo run check:format --affected
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Build internal packages — provides dist/ for lint + type jobs
frontend:build:
  extends: .frontend_base
  stage: lint
  tags:
    - shared
  interruptible: true
  script:
    - pnpm turbo run build --affected
  artifacts:
    paths:
      - .turbo/
      - packages/*/dist/
      - packages/*/build/
      - packages/*/.react-router/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ESLint — only apps/* (packages have upstream pre-existing issues)
frontend:lint:
  extends: .frontend_base
  stage: lint
  tags:
    - shared
  interruptible: true
  needs: [frontend:build]
  allow_failure: true
  script:
    - pnpm turbo run check:lint --filter="web" --filter="admin"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# TypeScript type check — only apps/* (packages have upstream pre-existing issues)
frontend:types:
  extends: .frontend_base
  stage: lint
  tags:
    - shared
  interruptible: true
  needs: [frontend:build]
  allow_failure: true
  script:
    - pnpm turbo run check:types --filter="web" --filter="admin"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Ruff Python lint — only when backend files change
backend:lint:
  stage: lint
  image: python:3.12-slim
  interruptible: true
  variables:
    PIP_CACHE_DIR: .pip-cache
  cache:
    <<: *pip_cache
  script:
    - pip install ruff
    - ruff check apps/api
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/api/**/*

# =============================================================================
# STAGE 2: TEST
# =============================================================================

# Docker Executor variant — external GitLab (IS_AIRGAPPED=false)
# Uses GitLab CI `services:` for ephemeral postgres + valkey containers
backend:test:docker:
  stage: test
  image: python:3.12-slim
  interruptible: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq libpq-dev build-essential libldap2-dev libsasl2-dev
  services:
    - name: postgres:15-alpine
      alias: postgres
    - name: valkey/valkey:7.2.11-alpine
      alias: redis
  variables:
    POSTGRES_DB: plane_test
    POSTGRES_USER: plane_user
    POSTGRES_PASSWORD: plane_password
    DATABASE_URL: "postgres://plane_user:plane_password@postgres:5432/plane_test"
    REDIS_URL: "redis://redis:6379/0"
    PIP_CACHE_DIR: .pip-cache
  cache:
    <<: *pip_cache
  script:
    - cd apps/api
    - pip install -r requirements/test.txt
    - python run_tests.py --unit --verbose
  rules:
    - if: >-
        $CI_PIPELINE_SOURCE == "merge_request_event" &&
        $IS_AIRGAPPED == "false"
      changes:
        - apps/api/**/*

# Shell Executor variant — air-gapped internal GitLab (IS_AIRGAPPED=true)
# Connects to PostgreSQL + Valkey installed locally on the Runner machine
# Runner prerequisite: psql client accessible, plane_user role created
backend:test:shell:
  stage: test
  interruptible: true
  variables:
    POSTGRES_DB: plane_test
    POSTGRES_USER: plane_user
    POSTGRES_PASSWORD: plane_password
    DATABASE_URL: "postgres://plane_user:plane_password@localhost:5432/plane_test"
    REDIS_URL: "redis://localhost:6379/0"
    PIP_CACHE_DIR: .pip-cache
  cache:
    <<: *pip_cache
  script:
    # Recreate test database (ignore error if it already exists)
    - psql -U plane_user -h localhost -c "DROP DATABASE IF EXISTS plane_test;" 2>/dev/null || true
    - psql -U plane_user -h localhost -c "CREATE DATABASE plane_test;" 2>/dev/null || true
    - cd apps/api
    - pip install -r requirements/test.txt
    - python run_tests.py --unit --verbose
  rules:
    - if: >-
        $CI_PIPELINE_SOURCE == "merge_request_event" &&
        $IS_AIRGAPPED == "true"
      changes:
        - apps/api/**/*

# =============================================================================
# STAGE 3: BUILD (3 dynamic images only: web, admin, api)
# Images exported as tar.gz because servers cannot pull from any registry
#
# Two variants per service (mirrors test job pattern):
#   :docker — Docker executor + DinD (gitlab.com, IS_AIRGAPPED=false)
#   :shell  — Shell executor, docker runs on host (air-gapped, IS_AIRGAPPED=true)
# =============================================================================

# ─── Build Template (Shell Executor — macOS / Linux / Windows/Git Bash) ──────
# Runner prerequisite (Windows): install Git for Windows, configure runner shell = "bash"

.build_shell_base:
  stage: build
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    # Detect Docker socket: unix socket on macOS/Linux, named pipe on Windows (Git Bash)
    - |
      case "$(uname -s)" in
        Darwin|Linux) export DOCKER_HOST="unix:///var/run/docker.sock" ;;
        *)            export DOCKER_HOST="npipe:////./pipe/docker_engine" ;;
      esac
    # On macOS: auto-start Docker Desktop if daemon is not running
    - |
      if [ "$(uname -s)" = "Darwin" ] && ! docker info >/dev/null 2>&1; then
        echo "Docker daemon not running — starting Docker Desktop..."
        open -a Docker
        for i in $(seq 1 30); do
          sleep 3
          docker info >/dev/null 2>&1 && echo "Docker ready." && break
          echo "  waiting... ($((i * 3))s elapsed)"
        done
        docker info >/dev/null 2>&1 || { echo "ERROR: Docker Desktop failed to start after 90s"; exit 1; }
      fi

# ─── Build Template (Docker Executor + DinD) ──────────────────────────────────

.build_docker_base:
  stage: build
  image: docker:latest
  tags:
    - docker # requires a Docker executor runner — never runs on Mac shell runner
  services:
    - docker:dind
  variables:
    # DinD service hostname — must match the service alias
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

# ── Web ───────────────────────────────────────────────────────────────────────

# Docker Executor variant — external GitLab (IS_AIRGAPPED=false)
# Also produces .shb-version and version.env (dotenv) for the release stage
build:web:docker:
  extends: .build_docker_base
  script:
    # Extract version from package.json — used as Docker tag + tar.gz filename
    - VERSION=$(grep -m1 version package.json | cut -d'"' -f4)
    - SHB_VERSION=shb_v${VERSION}
    - docker build --platform linux/amd64 -t makeplane/plane-frontend:${SHB_VERSION} -f apps/web/Dockerfile.web .
    - mkdir -p dist
    - docker save makeplane/plane-frontend:${SHB_VERSION} | gzip > dist/plane-frontend-${SHB_VERSION}.tar.gz
    - echo $SHB_VERSION > dist/.shb-version
    - echo SHB_VERSION=$SHB_VERSION > dist/version.env
  artifacts:
    paths:
      - dist/plane-frontend-*.tar.gz
      - dist/.shb-version
    reports:
      dotenv: dist/version.env
    expire_in: 1 day
  rules:
    - if: >-
        ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "preview") &&
        $IS_AIRGAPPED == "false"

# Shell Executor variant — air-gapped internal GitLab (IS_AIRGAPPED=true)
# Runs on development server (shb-dev runner) which is the only linux/amd64 build machine.
# Also produces .shb-version and version.env (dotenv) for downstream jobs.
build:web:shell:
  extends: .build_shell_base
  tags:
    - shb-dev
    - shell
  script:
    # Extract version from package.json — used as Docker tag + tar.gz filename
    - VERSION=$(grep -m1 version package.json | cut -d'"' -f4)
    - SHB_VERSION=shb_v${VERSION}
    # --platform linux/amd64: target servers are x86_64; dev server produces amd64 images
    - docker build --platform linux/amd64 -t makeplane/plane-frontend:${SHB_VERSION} -f apps/web/Dockerfile.web .
    - mkdir -p dist
    - docker save makeplane/plane-frontend:${SHB_VERSION} | gzip > dist/plane-frontend-${SHB_VERSION}.tar.gz
    - echo $SHB_VERSION > dist/.shb-version
    - echo SHB_VERSION=$SHB_VERSION > dist/version.env
  artifacts:
    paths:
      - dist/plane-frontend-*.tar.gz
      - dist/.shb-version
    reports:
      dotenv: dist/version.env
    expire_in: 1 day
  rules:
    - if: >-
        ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "preview" || $CI_COMMIT_TAG =~ /^prod\//) &&
        $IS_AIRGAPPED == "true"

# ── Admin ─────────────────────────────────────────────────────────────────────

# Docker Executor variant — external GitLab (IS_AIRGAPPED=false)
build:admin:docker:
  extends: .build_docker_base
  script:
    - VERSION=$(grep -m1 version package.json | cut -d'"' -f4)
    - SHB_VERSION=shb_v${VERSION}
    - docker build --platform linux/amd64 -t makeplane/plane-admin:${SHB_VERSION} -f apps/admin/Dockerfile.admin .
    - mkdir -p dist
    - docker save makeplane/plane-admin:${SHB_VERSION} | gzip > dist/plane-admin-${SHB_VERSION}.tar.gz
  artifacts:
    paths:
      - dist/plane-admin-*.tar.gz
    expire_in: 1 day
  rules:
    - if: >-
        ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "preview") &&
        $IS_AIRGAPPED == "false"

# Shell Executor variant — air-gapped internal GitLab (IS_AIRGAPPED=true)
build:admin:shell:
  extends: .build_shell_base
  tags:
    - shb-dev
    - shell
  script:
    - VERSION=$(grep -m1 version package.json | cut -d'"' -f4)
    - SHB_VERSION=shb_v${VERSION}
    - docker build --platform linux/amd64 -t makeplane/plane-admin:${SHB_VERSION} -f apps/admin/Dockerfile.admin .
    - mkdir -p dist
    - docker save makeplane/plane-admin:${SHB_VERSION} | gzip > dist/plane-admin-${SHB_VERSION}.tar.gz
  artifacts:
    paths:
      - dist/plane-admin-*.tar.gz
    expire_in: 1 day
  rules:
    - if: >-
        ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "preview" || $CI_COMMIT_TAG =~ /^prod\//) &&
        $IS_AIRGAPPED == "true"

# ── API ───────────────────────────────────────────────────────────────────────

# Docker Executor variant — external GitLab (IS_AIRGAPPED=false)
build:api:docker:
  extends: .build_docker_base
  script:
    - VERSION=$(grep -m1 version package.json | cut -d'"' -f4)
    - SHB_VERSION=shb_v${VERSION}
    # Build context is ./apps/api (not repo root) per Dockerfile.api requirements
    - docker build --platform linux/amd64 -t makeplane/plane-backend:${SHB_VERSION} -f apps/api/Dockerfile.api ./apps/api
    - mkdir -p dist
    - docker save makeplane/plane-backend:${SHB_VERSION} | gzip > dist/plane-backend-${SHB_VERSION}.tar.gz
  artifacts:
    paths:
      - dist/plane-backend-*.tar.gz
    expire_in: 1 day
  rules:
    - if: >-
        ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "preview") &&
        $IS_AIRGAPPED == "false"

# Shell Executor variant — air-gapped internal GitLab (IS_AIRGAPPED=true)
build:api:shell:
  extends: .build_shell_base
  tags:
    - shb-dev
    - shell
  script:
    - VERSION=$(grep -m1 version package.json | cut -d'"' -f4)
    - SHB_VERSION=shb_v${VERSION}
    # Build context is ./apps/api (not repo root) per Dockerfile.api requirements
    - docker build --platform linux/amd64 -t makeplane/plane-backend:${SHB_VERSION} -f apps/api/Dockerfile.api ./apps/api
    - mkdir -p dist
    - docker save makeplane/plane-backend:${SHB_VERSION} | gzip > dist/plane-backend-${SHB_VERSION}.tar.gz
  artifacts:
    paths:
      - dist/plane-backend-*.tar.gz
    expire_in: 1 day
  rules:
    - if: >-
        ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "preview" || $CI_COMMIT_TAG =~ /^prod\//) &&
        $IS_AIRGAPPED == "true"

# =============================================================================
# STAGE 4: DEPLOY
# Three deploy strategies:
#   deploy:dev              — local runner on dev server, uses CI artifacts (no SSH)
#   publish:manual:dev       — uploads pre-built images from server dist/ to registry (no build)
#   deploy:dev:release      — auto after publish:manual:dev, pulls from registry
#   deploy:prod:release     — auto on prod/* tag, shb-prod runner on prod server
#
# No SSH/SCP for internal deploys — runners already execute on their target server.
# Server credentials are NOT stored in GitLab CI variables.
# Each server reads /etc/plane-release-deploy.env (chmod 0400, runner-owned).
# =============================================================================

# ── Deploy Dev — auto on merge to develop, runner already on dev server ───────
# Runner: shb-dev (shell executor on dev server); no SSH, no sshpass.
# Copies CI artifacts to /tmp/plane-deploy/ and runs ci-deploy.sh locally.
deploy:dev:
  stage: deploy
  tags:
    - shb-dev
    - shell
    - deploy
  interruptible: false
  needs:
    - job: build:web:shell
      artifacts: true
    - job: build:admin:shell
      artifacts: true
    - job: build:api:shell
      artifacts: true
  variables:
    GIT_STRATEGY: none
  script:
    - SHB_VERSION=$(cat dist/.shb-version)
    - rm -rf /tmp/plane-deploy && mkdir -p /tmp/plane-deploy
    - cp dist/*.tar.gz dist/.shb-version /tmp/plane-deploy/
    - SHB_VERSION="${SHB_VERSION}" bash scripts/ci-deploy.sh
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" && $IS_AIRGAPPED == "true"
  environment:
    name: dev
    url: https://uat-jms.shinhan.com.vn

# ── Publish Dev Release (Manual Build) — auto on dev/* tag ───────────────────
# Uploads pre-built images from the runner server's local dist/ to GitLab Package Registry.
# Images must already exist on the server at PLANE_DIR/dist/ (scp'd from local Mac).
# No build dependencies — skips the CI build step entirely.
publish:manual:dev:
  stage: release
  tags:
    - shb-dev
    - shell
  needs:
    - none
  variables:
    GIT_STRATEGY: none
    # SHB_VERSION derived from tag: dev/shb_v1.2.0 → shb_v1.2.0
    SHB_VERSION: "${CI_COMMIT_TAG#dev/}"
    RELEASE_TAG: "${CI_COMMIT_TAG}"
    CI_COMMIT_SHA: "${CI_COMMIT_SHA:-0000000000000000000000000000000000000000}"
  script:
    - bash scripts/publish-gitlab-release-package.sh
  rules:
    - if: $CI_COMMIT_TAG =~ /^dev\// && $IS_AIRGAPPED == "true"
      when: on_success

# ── Deploy Dev from Release Package — auto on dev/* tag ───────────────────────
# Pulls the release package from GitLab Package Registry and deploys.
# Package must already exist in registry (uploaded via publish-gitlab-release-package.sh
# from an internal machine before pushing the tag).
deploy:dev:release:
  stage: deploy
  tags:
    - shb-dev
    - shell
    - deploy
  interruptible: false
  variables:
    GIT_STRATEGY: none
    RELEASE_TAG: "${CI_COMMIT_TAG}"
  script:
    - bash scripts/deploy-from-internal-gitlab-release.sh
  rules:
    - if: $CI_COMMIT_TAG =~ /^dev\// && $IS_AIRGAPPED == "true"
      when: on_success
  environment:
    name: dev/release
    url: https://uat-jms.shinhan.com.vn

# ── Deploy Prod from Release Package — auto on prod/* tag ─────────────
# Triggers on prod/* tag pipelines only. Runner is shb-prod on production server.
# RELEASE_TAG is automatically the triggering tag (prod/shb_vX.Y.Z).
deploy:prod:release:
  stage: deploy
  tags:
    - shb-prod
    - shell
    - deploy-only
  interruptible: false
  variables:
    GIT_STRATEGY: none
    RELEASE_TAG: "${CI_COMMIT_TAG}"
  script:
    - bash scripts/deploy-from-internal-gitlab-release.sh
  rules:
    - if: $CI_COMMIT_TAG =~ /^prod\// && $IS_AIRGAPPED == "true"
      when: on_success
      allow_failure: false
  environment:
    name: production
    url: https://jms.shinhan.com.vn

# ── Deploy External Test — auto on merge to develop (external gitlab.com only) ─
# Uses a temporary VPS to validate SSH + SCP flow end-to-end on gitlab.com path.
# Not used in air-gapped environment.
deploy:external-test:
  stage: deploy
  interruptible: false
  before_script:
    - apt-get update -qq && apt-get install -y -qq sshpass
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
  script:
    - sshpass -p "$VPS_PASSWORD" ssh $VPS_USER@$VPS_HOST "rm -rf /tmp/plane-deploy && mkdir -p /tmp/plane-deploy"
    - sshpass -p "$VPS_PASSWORD" scp dist/*.tar.gz dist/.shb-version $VPS_USER@$VPS_HOST:/tmp/plane-deploy/
    - sshpass -p "$VPS_PASSWORD" scp scripts/ci-deploy.sh $VPS_USER@$VPS_HOST:/tmp/ci-deploy.sh
    - SHB_VERSION=$(cat dist/.shb-version)
    # VPS uses home-based path (no sudo); internal servers use default path
    - sshpass -p "$VPS_PASSWORD" ssh $VPS_USER@$VPS_HOST "PLANE_DIR=/home/$VPS_USER/plane-app SHB_VERSION=$SHB_VERSION bash /tmp/ci-deploy.sh"
    - sshpass -p "$VPS_PASSWORD" ssh $VPS_USER@$VPS_HOST "rm -f /tmp/ci-deploy.sh"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" && $IS_AIRGAPPED == "false"
  environment:
    name: external-test
    url: http://$VPS_HOST

# =============================================================================
# STAGE 5: RELEASE
# Publish release packages to internal GitLab Generic Package Registry.
#
# Requires CI variables (GitLab Settings → CI/CD → Variables):
#   GITLAB_PUBLISH_TOKEN — project access token (write_package_registry + api scopes)
#                          NEVER use api scope for deploy token on prod; publish only.
#
# Tag format:
#   dev/*  — e.g. dev/shb_v1.2.0-build.5   (dev server validation release)
#   prod/* — e.g. prod/shb_v1.2.0            (Maintainer+ creates this tag manually)
#
# Protected tag rule must be configured in GitLab:
#   Settings → Repository → Protected tags → prod/* → Allowed to create: Maintainer+
# =============================================================================

# Docker Executor variant — external GitLab (IS_AIRGAPPED=false)
# Creates a legacy-style release after build succeeds (no binary package upload).
release:production:docker:
  stage: release
  image: alpine:latest
  needs:
    - job: build:web:docker
      artifacts: true # provides $SHB_VERSION from dotenv
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Creating tag + release for ${SHB_VERSION} ..."
    - |
      curl --fail -s \
        --request POST \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        --data "tag_name=${SHB_VERSION}&ref=${CI_COMMIT_SHA}&message=Release ${SHB_VERSION}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags"
    - |
      curl --fail -s \
        --request POST \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        --header "Content-Type: application/json" \
        --data "{\"name\":\"${SHB_VERSION}\",\"tag_name\":\"${SHB_VERSION}\",\"description\":\"Release ${SHB_VERSION} — commit ${CI_COMMIT_SHORT_SHA}\"}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
    - echo "  ✓ Released ${SHB_VERSION}"
  rules:
    - if: $CI_COMMIT_BRANCH == "preview" && $IS_AIRGAPPED == "false"
      when: on_success

# ── Publish Dev Release — air-gapped, runs after build on develop or preview ──
# Publishes a dev/* release package to internal GitLab for parity testing.
# Tag: dev/shb_v{VERSION}-build.{PIPELINE_IID}
# Uses GITLAB_PUBLISH_TOKEN (write_package_registry + api) — NOT api-only.
release:publish:dev:
  stage: release
  tags:
    - shb-dev
    - shell
  needs:
    - job: build:web:shell
      artifacts: true # provides SHB_VERSION via dotenv
    - job: build:admin:shell
      artifacts: true
    - job: build:api:shell
      artifacts: true
  variables:
    GIT_STRATEGY: none
  script:
    - export RELEASE_TAG="dev/${SHB_VERSION}-build.${CI_PIPELINE_IID}"
    - bash scripts/publish-gitlab-release-package.sh
  rules:
    - if: >-
        ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "preview") &&
        $IS_AIRGAPPED == "true"
      when: on_success

# ── Publish Prod Release — triggered when Maintainer creates a prod/* tag ─────
# Builds are re-run from the exact tagged commit to produce the prod release package.
# The prod/* tag must already be protected (Maintainer+ create only).
# Uses GITLAB_PUBLISH_TOKEN (write_package_registry + api).
release:publish:prod:
  stage: release
  tags:
    - shb-dev
    - shell
  needs:
    - job: build:web:shell
      artifacts: true # provides SHB_VERSION via dotenv
    - job: build:admin:shell
      artifacts: true
    - job: build:api:shell
      artifacts: true
  variables:
    GIT_STRATEGY: none
    RELEASE_TAG: "${CI_COMMIT_TAG}"
  script:
    - bash scripts/publish-gitlab-release-package.sh
  rules:
    - if: $CI_COMMIT_TAG =~ /^prod\// && $IS_AIRGAPPED == "true"
      when: on_success
